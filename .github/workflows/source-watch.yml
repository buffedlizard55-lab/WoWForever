name: Source watch

# Decision recorded on the Work plan page: option (b) — a scheduled job that
# checks every registered source URL for changes and opens an issue with the
# diff summary. It never edits site content; a human re-verifies and updates the
# ledger. See work-plan.html#decisions and ledger claim C122.

on:
  schedule:
    # 07:00 UTC every Monday. Weekly is enough: our claims carry snapshot dates,
    # and a daily job would mostly report guide-site chrome churn.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      init:
        description: 'Baseline only — record fingerprints without reporting changes'
        type: boolean
        default: false
  push:
    branches: [main]
    # Self-healing, not noise: the preflight job below lets a push run only when
    # no fingerprint baseline exists yet, so a lost or never-created
    # tools/source-state.json repairs itself on the next push to main. When the
    # baseline is present, pushes skip the network job entirely. (A baseline
    # commit made with the default token does not re-trigger workflows, so this
    # cannot loop.)

permissions:
  contents: write
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      run_check: ${{ steps.decide.outputs.run_check }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run the network check
        id: decide
        run: |
          if [ "${RUNNER_EVENT}" = "push" ] && [ -f tools/source-state.json ]; then
            echo "run_check=false" >> "$GITHUB_OUTPUT"
            echo "A fingerprint baseline already exists; this push does not need a network run."
          else
            echo "run_check=true" >> "$GITHUB_OUTPUT"
            echo "No usable baseline yet (or a scheduled/manual run): proceeding to the network check."
          fi
        env:
          RUNNER_EVENT: ${{ github.event_name }}

  check:
    needs: preflight
    if: needs.preflight.outputs.run_check == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the watcher itself (offline, no network)
        run: node tools/test-source-watch.mjs

      - name: Check registered source URLs
        id: check
        run: node tools/check-sources.mjs ${{ inputs.init && '--init' || '' }}

      # A baseline made of nothing is worse than no baseline: every later run
      # would compare against it and stay silent. The script already refuses to
      # write one; this step makes the failure loud instead of green.
      - name: Fail if no source could be fingerprinted
        if: steps.check.outputs.baseline_established != 'true'
        run: |
          echo "::error::No registered source could be fingerprinted from this runner."
          echo "The baseline was deliberately not written, so the next run is still a first run."
          echo "Check whether the runner has outbound network access at all before re-running."
          exit 1

      - name: Open an issue when sources moved
        if: steps.check.outputs.needs_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Source watch: ${{ steps.check.outputs.changed }} changed, ${{ steps.check.outputs.unreachable }} unreachable" \
            --body-file tools/source-report.md \
            --label "source-watch" || \
          gh issue create \
            --title "Source watch: ${{ steps.check.outputs.changed }} changed, ${{ steps.check.outputs.unreachable }} unreachable" \
            --body-file tools/source-report.md

      - name: Commit the updated fingerprint state
        run: |
          if [ -n "$(git status --porcelain tools/source-state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/source-state.json
            git commit -m "chore(source-watch): update source fingerprints"
            git push
          else
            echo "No fingerprint changes to commit."
          fi
