name: Verify

# This is the gate the site claims to have. Every check runs offline against the
# repository's own data files, so a pull request cannot merge a dangling source
# id, an unregistered external link, a broken anchor, a stale snapshot date or an
# impossible market-log row, or an unanchored quotation, without the failure
# being visible here.
#
# The Work plan page states that "tools/check-ledger.mjs fails the build if a
# claim has no registered source" — this workflow is what makes that sentence
# true rather than aspirational.
#
# The checks that run here: ledger integrity, citation integrity (registered
# sources, resolving anchors, machine-checked self-reported counts), market-log
# schema, quotation anchoring, accessibility/print structure, the public-endpoint
# register (eligibility flags, published limits, no rejected URL linked), the
# site-pattern register (dated observations, registered example URLs, nothing
# unverified linked), the rendered-table test, and offline self-tests of the two
# watchers (page fingerprints and structured feeds) that run in the other workflow.

# The endpoint and pattern checks exist because both registers publish links that
# a reader is invited to open. A register that drifts from the data files, or
# that links a URL nobody registered, would be exactly the kind of quiet failure
# this project promises not to have.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Claims ledger integrity
        run: node tools/check-ledger.mjs

      - name: Ledger staleness (warn only)
        run: node tools/check-ledger.mjs --stale 30
        continue-on-error: true

      - name: Citation audit (sources, links, anchors, claim ids, tag balance)
        run: node tools/check-citations.mjs --strict

      - name: Market log schema
        run: node tools/check-market-log.mjs

      - name: Quote anchoring (every quotation needs a nearby source or claim id)
        run: node tools/check-quotes.mjs --strict

      - name: Accessibility and print structure
        run: node tools/check-a11y.mjs --strict

      - name: Public endpoint register (eligibility, limits, no rejected URL linked)
        run: node tools/check-apis.mjs --strict

      - name: Site-pattern register (dated observations, registered example URLs)
        run: node tools/check-patterns.mjs --strict

      - name: Rendered-table test (offline DOM stub, no headless browser)
        run: node tools/test-render.mjs

      - name: Source watcher self-test (offline fixtures, no network)
        run: node tools/test-source-watch.mjs

      - name: Feed watcher self-test (offline fixtures, no network; also proves every feed URL is a registered source)
        run: node tools/test-watch-feeds.mjs
